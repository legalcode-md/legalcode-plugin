name: Claude plugin conformance

on:
  push:
    branches: [main]
    paths:
      - "plugins/legalcode-claude/**"
      - ".claude-plugin/marketplace.json"
      - "scripts/validate_claude_package.py"
      - "requirements-dev.txt"
      - ".github/workflows/claude-plugin-conformance.yml"
  pull_request:
    paths:
      - "plugins/legalcode-claude/**"
      - ".claude-plugin/marketplace.json"
      - "scripts/validate_claude_package.py"
      - "requirements-dev.txt"
      - ".github/workflows/claude-plugin-conformance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate complete skill packages, provenance, and current tool contract
        run: python scripts/validate_claude_package.py
      - name: Exercise bundled DOCX and PPTX helpers
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s plugins/legalcode-claude/skills/legalcode-document-to-skill/tests
